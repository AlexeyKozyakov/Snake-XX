name: Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:

    name: Replace Latest Release APK
    runs-on: ubuntu-latest

    steps:

      # ----------------------------
      # Checkout main
      # ----------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ----------------------------
      # Setup JDK
      # ----------------------------
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ----------------------------
      # Setup Android SDK
      # ----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      # ----------------------------
      # Get current version
      # ----------------------------
      - name: Get current version
        id: version
        run: |

          FILE=app/build.gradle.kts

          CURRENT_NAME=$(grep "versionName" "$FILE" | sed 's/[^0-9.]//g')

          if [ -z "$CURRENT_NAME" ]; then
            echo "Could not find versionName"
            exit 1
          fi

          MAJOR=$(echo $CURRENT_NAME | cut -d. -f1)
          MINOR=$(echo $CURRENT_NAME | cut -d. -f2)

          echo "VERSION_NAME=$MAJOR.$MINOR" >> "$GITHUB_OUTPUT"

          echo "Current version: $MAJOR.$MINOR"

      # ----------------------------
      # Check release exists
      # ----------------------------
      - name: Check GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION_NAME }}

        run: |
          TAG="v$VERSION"

          echo "Checking release $TAG"

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY"

      # ----------------------------
      # Prepare JKS
      # ----------------------------
      - name: Prepare keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" \
            | base64 --decode > release.jks

      # ----------------------------
      # Check JKS
      # ----------------------------
      - name: Check keystore
        run: |
          keytool -list \
            -keystore release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}"

      # ----------------------------
      # Build signed APK
      # ----------------------------
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ----------------------------
      # Verify APK signature
      # ----------------------------
      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner \
            verify \
            --verbose \
            --print-certs \
            "$APK"

      # ----------------------------
      # Rename APK
      # ----------------------------
      - name: Prepare APK
        run: |
          VERSION=${{ steps.version.outputs.VERSION_NAME }}

          cp \
            app/build/outputs/apk/release/app-release.apk \
            "app-release-v${VERSION}.apk"

      # ----------------------------
      # APK Artifact
      # ----------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v${{ steps.version.outputs.VERSION_NAME }}.apk
          path: app-release-v${{ steps.version.outputs.VERSION_NAME }}.apk

      # ----------------------------
      # Remove old APK
      # ----------------------------
      - name: Remove old APK from release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION_NAME }}

        run: |
          TAG="v$VERSION"
          APK="app-release-v${VERSION}.apk"

          echo "Removing old $APK from release $TAG"

          gh release delete-asset \
            "$TAG" \
            "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --yes \
            || true

      # ----------------------------
      # Upload new APK
      # ----------------------------
      - name: Upload hotfix APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION_NAME }}

        run: |
          TAG="v$VERSION"
          APK="app-release-v${VERSION}.apk"

          echo "Uploading $APK to release $TAG"

          gh release upload \
            "$TAG" \
            "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
